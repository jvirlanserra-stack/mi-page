<html lang="es">

<head>
    <title>clicker</title>
</head>

<body>
    <div id="thediv" style="justify-content: center; align-items: center;">

        <button onclick="clic();">
            ¡Haz clic en mí!<br><img src="aCookie.jpg"
                                     width="100" height="100" id="cookie">
        </button>
        <span id="texto">Puntos: 0</span>

        <br>
        <br>

        <button onclick="upg0fnc();" id="upg0">+1 punto/clic (1pt, level 1)</button>
        <!--<button onclick="upg1fnc();"></button>-->

    </div>
    <script>

        const eldiv = document.getElementById("thediv");
        
        let puntos = 0;
        let upg0 = 0;
        let upg1 = 0;

//eldiv.style.transform = `scale(${Math.min(
//    window.innerWidth,
//    window.innerHeight
//) / Math.min(
//    eldiv.getBoundingClientRect().width,
//    eldiv.getBoundingClientRect().height
//) })`;

                                function dibujar(id, dibujo) {
                                    document.getElementById(id).innerHTML = dibujo;
                                }

                                function clic() {
                                    puntos += upg0 + 1;
                                    dibujar("texto", `Puntos: ${puntos}`);
                                }

                                function upg0fnc() {
                                    if (puntos >= 2 ** upg0) {
                                        puntos -= 2 ** upg0;
                                        upg0++;
                                        dibujar("texto", `Puntos: ${puntos}`);
                                        dibujar("upg0", `+1 punto/clic (${2 ** upg0}pt, level${upg0 + 1})`);
                                    }
                                }

                                function upg1fnc() { }

    </script>
</body>

</html>
