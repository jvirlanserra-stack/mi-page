<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101018">
  <meta name="description" content="Una pequeña ventana a las 22:00.">
  <title>22:00 — un instante para ti</title>
  <style>
    :root { color-scheme: dark; --ink:#f7f4ff; --muted:#b9b3cb; --violet:#bd9cff; --mint:#9ff5d0; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100svh; color:var(--ink); font-family: ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background: radial-gradient(ellipse at 50% 42%, #30234f 0%, #171522 43%, #0c0c12 100%); overflow-x:hidden }
    body::before, body::after { content:""; position:fixed; inset:0; pointer-events:none }
    body::before { opacity:.34; background-image:radial-gradient(1px 1px at 13% 22%,#fff 99%,transparent),radial-gradient(1px 1px at 82% 18%,#fff 99%,transparent),radial-gradient(2px 2px at 71% 67%,#fff 99%,transparent),radial-gradient(1px 1px at 28% 76%,#fff 99%,transparent),radial-gradient(1px 1px at 91% 83%,#fff 99%,transparent),radial-gradient(1px 1px at 43% 12%,#fff 99%,transparent); background-size:310px 270px }
    body::after { background:linear-gradient(180deg,transparent 65%,#0c0c12 100%) }
    main { position:relative; z-index:1; min-height:100svh; width:min(100% - 40px,1000px); margin:auto; display:grid; align-content:center; justify-items:center; text-align:center; padding:72px 0 }
    .eyebrow { display:flex; align-items:center; gap:10px; color:var(--mint); font-size:.75rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase }
    .dot { width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 16px var(--mint) }
    h1 { margin:22px 0 12px; font-size:clamp(4.5rem,17vw,10rem); line-height:.86; letter-spacing:-.09em; font-weight:750; text-shadow:0 0 60px #bd9cff55 }
    h1 span { color:var(--violet) }
    .subtitle { margin:22px 0 0; max-width:520px; color:var(--muted); font-size:clamp(1rem,2.6vw,1.2rem); line-height:1.7 }
    .orb-wrap { width:min(42vw,190px); aspect-ratio:1; margin:40px 0 30px; display:grid; place-items:center; position:relative }
    .orb { width:62%; aspect-ratio:1; border-radius:50%; background:linear-gradient(145deg,#fff4c8,#f8c6a7 48%,#bd9cff 100%); box-shadow:0 0 35px #efb7ff88,0 0 100px #9d74ff55; animation:float 6s ease-in-out infinite }
    .ring { position:absolute; inset:3%; border:1px solid #ffffff22; border-radius:50%; transform:rotate(-28deg) scaleY(.34) }
    .ring:nth-child(3) { transform:rotate(28deg) scaleY(.34) }
    .note { display:flex; gap:13px; align-items:flex-start; max-width:490px; padding:16px 19px; text-align:left; color:#e9e3f5; border:1px solid #ffffff17; background:#ffffff09; border-radius:16px; backdrop-filter:blur(10px); font-size:.95rem; line-height:1.55 }
    .spark { color:var(--mint); flex:0 0 auto }
    footer { margin-top:42px; color:#8c869d; font-size:.78rem; letter-spacing:.08em }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
    @media (max-width:520px) { main{width:min(100% - 30px,1000px);padding:52px 0}.orb-wrap{width:42vw;margin:32px 0 25px}.note{padding:14px 15px}footer{margin-top:32px} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span> martes · 2 de noviembre de 2026</div>
    <h1>22<span>:</span>00</h1>
    <p class="subtitle">El día baja el volumen.<br>Este ratito es tuyo.</p>
    <div class="orb-wrap" aria-hidden="true"><div class="orb"></div><div class="ring"></div><div class="ring"></div></div>
    <div class="note"><span class="spark" aria-hidden="true">✦</span><span>Respira hondo. Suelta los hombros. No hace falta tenerlo todo resuelto esta noche.</span></div>
    <footer>UN INSTANTE · UNA COSA A LA VEZ</footer>
  </main>
</body>
</html>
